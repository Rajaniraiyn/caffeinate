name: Release size comparison
on:
  push:
    branches: [macos-size-check]
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, target: x86_64-apple-darwin, platform: macos, arch: x86_64}
          - {runner: macos-15, target: aarch64-apple-darwin, platform: macos, arch: arm64e}
          - {runner: windows-2025, target: x86_64-pc-windows-msvc, platform: windows}
          - {runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: glibc}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, platform: musl}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      TOOLCHAIN: nightly-2026-11-20
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      APPLE_ARCH: ${{ matrix.arch }}
      PYTHON: ${{ matrix.platform == 'windows' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install libdbus headers
        if: matrix.platform == 'glibc'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Build candidates
        shell: bash
        run: |
          if [[ "$PLATFORM" == musl ]]; then
            docker run --rm -v "$PWD:/src" -w /src -e PLATFORM -e TARGET -e TOOLCHAIN \
              -e CFLAGS=-fstack-protector-strong rust:1-alpine3.21 sh -ec '
                apk add --no-cache bash build-base
                bash .github/scripts/size-probe.sh
              '
          else
            bash .github/scripts/size-probe.sh
          fi
      - name: Compare size and behavior
        shell: bash
        run: |
          "$PYTHON" .github/scripts/size-probe.py

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release. Leave blank for the next version.
        type: string
      build_only:
        description: Build and test packages without publishing.
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  RELEASE_TOOLCHAIN: nightly-2026-11-20

jobs:
  prepare:
    if: github.event_name == 'push' || inputs.build_only || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      source: ${{ steps.version.outputs.source }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Choose release version
        id: version
        shell: pwsh
        run: |
          $tag = ./.github/scripts/release-version.ps1 -Tag $env:RELEASE_TAG
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "source=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, platform: windows, arch: x64, target: x86_64-pc-windows-msvc}
          - {runner: windows-2025, platform: windows, arch: arm64, target: aarch64-pc-windows-msvc}
          - {runner: macos-15-intel, platform: macos, arch: x64, target: x86_64-apple-darwin}
          - {runner: macos-15, platform: macos, arch: arm64, target: aarch64-apple-darwin}
          - {runner: ubuntu-22.04, platform: linux, arch: x64, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-22.04-arm, platform: linux, arch: arm64, target: aarch64-unknown-linux-gnu}
          - {runner: ubuntu-24.04, platform: linux, arch: x64, target: x86_64-unknown-linux-musl, musl: true}
          - {runner: ubuntu-24.04-arm, platform: linux, arch: arm64, target: aarch64-unknown-linux-musl, musl: true}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: manifests
      - name: Install libdbus headers
        if: runner.os == 'Linux' && !matrix.musl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Build and test
        if: "!matrix.musl"
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal --target "$TARGET"
          cargo +"$RELEASE_TOOLCHAIN" build --locked --release --target "$TARGET" --bin caffeinate
          if [[ "$PLATFORM-$ARCH" != windows-arm64 ]]; then
            cargo +stable test --locked --target "$TARGET"
            "./target/$TARGET/release/caffeinate${{ runner.os == 'Windows' && '.exe' || '' }}" --help
          fi
      - name: Build and test on Alpine
        if: matrix.musl
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e TARGET \
            -e RELEASE_TOOLCHAIN -e CFLAGS_aarch64_unknown_linux_musl=-mno-outline-atomics \
            -e RUSTFLAGS='-C target-feature=+crt-static' rust:1-alpine3.21 sh -ec '
              apk add --no-cache build-base
              rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal --target "$TARGET"
              cargo +"$RELEASE_TOOLCHAIN" build --locked --release --target "$TARGET" --bin caffeinate
              cargo test --locked --target "$TARGET"
              release="target/$TARGET/release"
              "$release/caffeinate" --help
              for dbus in "$CARGO_HOME"/registry/src/*/libdbus-sys-*/vendor/dbus; do
                crate=$(basename "$(dirname "$(dirname "$dbus")")")
                version=${crate#libdbus-sys-}
                printf "This distribution includes libdbus under AFL-2.1.\nSource: https://crates.io/api/v1/crates/libdbus-sys/%s/download\n\n" "$version"
                cat "$dbus/COPYING"
              done > "$release/LICENSE-dbus.txt"
            '
          if readelf -l "target/$TARGET/release/caffeinate" | grep -q INTERP; then
            echo 'Expected a static musl binary' >&2
            exit 1
          fi
      - name: Package binary
        run: |
          mkdir -p dist
          name="caffeinate-$TAG-$PLATFORM-$ARCH"
          release="$PWD/target/$TARGET/release"
          case "$PLATFORM" in
            windows)
              cp LICENSE-MIT LICENSE-APACHE "$release"
              (cd "$release" && python -m zipfile -c "../../../dist/$name.zip" caffeinate.exe LICENSE-MIT LICENSE-APACHE)
              ;;
            linux|macos)
              files=(caffeinate)
              case "$TARGET" in
                *-musl) name="$name-musl"; files+=(LICENSE-dbus.txt) ;;
                *-gnu) name="$name-glibc" ;;
              esac
              tar -czf "dist/$name.tar.gz" LICENSE-MIT LICENSE-APACHE -C "$release" "${files[@]}"
              ;;
          esac
      - name: Build Debian and RPM packages
        if: matrix.musl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm cpio
          binary="$PWD/target/$TARGET/release/caffeinate"
          bash .github/packaging/linux.sh "$binary" "${TAG#v}" "$(dirname "$binary")/LICENSE-dbus.txt" "$PWD/dist"
          dpkg-deb --extract dist/*.deb "$RUNNER_TEMP/deb"
          mkdir "$RUNNER_TEMP/rpm"
          rpm2cpio dist/*.rpm | (cd "$RUNNER_TEMP/rpm" && cpio -id)
          cmp "$binary" "$RUNNER_TEMP/deb/usr/bin/caffeinate"
          cmp "$binary" "$RUNNER_TEMP/rpm/usr/bin/caffeinate"
      - name: Build Windows Installer package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $wix = Join-Path $env:RUNNER_TEMP wix
          dotnet tool install wix --version 6.0.2 --tool-path $wix
          $version = $env:TAG.Substring(1)
          $binary = "target/$env:TARGET/release/caffeinate.exe"
          & "$wix/wix.exe" build .github/packaging/caffeinate.wxs -arch $env:ARCH `
            -d "Version=$version" -d "Binary=$binary" -bindpath . -pdbtype none `
            -o "dist/caffeinate-$env:TAG-windows-$env:ARCH.msi"
      - name: Check Windows install and uninstall
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $msi = (Get-Item dist/*.msi).FullName
          $directory = Join-Path $env:LOCALAPPDATA caffeinate
          $exe = Join-Path $directory caffeinate.exe
          function Get-UserPathEntries {
            [Environment]::GetEnvironmentVariable('Path', 'User') -split ';' |
              ForEach-Object { $_.TrimEnd('\') } | Where-Object { $_ }
          }
          function Invoke-Installer([string]$action) {
            $process = Start-Process msiexec.exe -ArgumentList "$action `"$msi`" /qn /norestart" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "msiexec $action returned $($process.ExitCode)" }
          }
          $originalEntries = Get-UserPathEntries
          Invoke-Installer /i
          try {
            if ($directory -notin (Get-UserPathEntries)) { throw 'PATH entry missing after install' }
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw "caffeinate returned $LASTEXITCODE" }
          } finally {
            Invoke-Installer /x
          }
          if ((Test-Path $exe) -or $directory -in (Get-UserPathEntries)) {
            throw 'Uninstall left the binary or PATH entry behind'
          }
          if (($originalEntries -join ';') -ne ((Get-UserPathEntries) -join ';')) {
            throw 'Install and uninstall changed unrelated PATH entries'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: "!inputs.build_only"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: manifests
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish release
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (!$env:RELEASE_TAG) {
            if (git status --porcelain -- Cargo.toml Cargo.lock) {
              git add -- Cargo.toml Cargo.lock
              git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Release $env:TAG"
            }
            git tag $env:TAG
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "refs/tags/$env:TAG"
          }

          $assets = Get-ChildItem -File dist
          $sums = foreach ($asset in $assets) {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $asset.FullName).Hash.ToLowerInvariant(), $asset.Name
          }
          $sums | Set-Content -LiteralPath dist/SHASUMS256.txt
          $files = @($assets.FullName) + 'dist/SHASUMS256.txt'
          gh release create $env:TAG @files --verify-tag --generate-notes --title $env:TAG

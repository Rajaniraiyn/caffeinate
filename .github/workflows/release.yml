name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release. Leave blank for the next version.
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Choose release version
        id: version
        run: |
          $tag = ./.github/scripts/release-version.ps1 -Tag $env:RELEASE_TAG
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Windows binaries
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          cargo +stable test --locked --target x86_64-pc-windows-msvc
          cargo +stable build --release --locked --target x86_64-pc-windows-msvc --target aarch64-pc-windows-msvc
          ./target/x86_64-pc-windows-msvc/release/caffeinate.exe /?

      - name: Package release assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: ./.github/scripts/package.ps1 -Tag $env:TAG

      - name: Publish release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (!$env:RELEASE_TAG) {
            if (git status --porcelain -- Cargo.toml Cargo.lock) {
              git add -- Cargo.toml Cargo.lock
              git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Release $env:TAG"
            }
            git tag $env:TAG
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "refs/tags/$env:TAG"
          }

          $assets = (Get-ChildItem -File dist).FullName
          gh release create $env:TAG @assets --verify-tag --generate-notes --title $env:TAG

name: Check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install libdbus headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Check and build
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          cargo +stable fmt --check
          cargo +stable test --locked
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable build --release --locked
          wc -c target/release/caffeinate${{ runner.os == 'Windows' && '.exe' || '' }}

          rustup toolchain install 1.91.0 --profile minimal
          cargo +1.91.0 test --locked --no-default-features

      - name: Check Linux desktop D-Bus calls
        if: runner.os == 'Linux'
        run: dbus-run-session -- cargo +stable test --locked --lib platform::power -- --ignored --test-threads=1

      - name: Check Unix commands and the native inhibitor
        if: runner.os != 'Windows'
        shell: bash
        run: |
          executable="$PWD/target/release/caffeinate"
          if [[ "$RUNNER_OS" == Linux ]]; then
            run=(sudo -- "$executable")
          else
            run=("$executable")
          fi
          "${run[@]}" -it1
          status=0
          "${run[@]}" -it1 /bin/sh -c 'sleep 2; exit 37' || status=$?
          test "$status" -eq 37

  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1
        with:
          release: '14.4'
          prepare: pkg install -y rust dbus pkgconf
          run: |
            cargo test --locked
            dbus-run-session -- cargo test --locked --lib platform::power -- --ignored --test-threads=1
            cargo build --locked --release
            target/release/caffeinate --help

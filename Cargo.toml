[package]
name = "caffeinate"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
description = "Keep your PC awake from the command line."
repository = "https://github.com/Rajaniraiyn/caffinate"

[dependencies]
usage-rs = { version = "7.4", default-features = false, features = ["help", "diagnostics"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

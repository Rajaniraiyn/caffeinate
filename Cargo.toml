[package]
name = "caffeinate"
version = "0.3.1"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Keep your computer awake from the command line."
repository = "https://github.com/Rajaniraiyn/caffinate"

[features]
default = ["cli"]
cli = ["dep:signal-hook", "dep:usage-rs"]

[[bin]]
name = "caffeinate"
required-features = ["cli"]

[dependencies]
usage-rs = { version = "7.4", optional = true, default-features = false, features = ["help", "diagnostics"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "event", "process"] }
signal-hook = { version = "0.4", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["alloc", "CFString"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["pwr_mgt"] }

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
dbus = { version = "0.9", default-features = false, features = ["stdfd"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
dbus = { version = "0.9", default-features = false, features = ["stdfd", "vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

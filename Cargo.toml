[package]
name = "caffeinate"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Keep your PC awake from the command line."
repository = "https://github.com/Rajaniraiyn/caffinate"

[dependencies]
usage-rs = { version = "7.4", default-features = false, features = ["help", "diagnostics"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "event", "process"] }
signal-hook = { version = "0.4", default-features = false }
wait-timeout = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["alloc", "CFString"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["pwr_mgt"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", default-features = false, features = ["stdfd"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
